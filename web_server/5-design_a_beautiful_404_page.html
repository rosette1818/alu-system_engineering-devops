<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1e293b, #0f172a);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 2rem;
    }
    .card {
      max-width: 520px;
      padding: 3rem 2rem;
      border-radius: 16px;
      background: rgba(30, 41, 59, 0.75);
      border: 1px solid rgba(148, 163, 184, 0.2);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    h1 {
      font-size: 6rem;
      line-height: 1;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
    }
    h2 { font-size: 1.5rem; margin-bottom: 0.75rem; color: #e2e8f0; }
    p { color: #94a3b8; margin-bottom: 1.75rem; line-height: 1.6; }
    a {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      background: #38bdf8;
      color: #0f172a;
      font-weight: 600;
      text-decoration: none;
    }
    a:hover { background: #7dd3fc; }
  </style>
</head>
<body>
  <div class="card">
    <h1>404</h1>
    <h2>Ceci n'est pas une page</h2>
    <p>Looks like you drifted off the map. The page you are looking for does not exist or has been moved.</p>
    <a href="/">Return Home</a>
  </div>
</body>
</html>
